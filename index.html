<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Spring Diary</title>

<!-- PWA: installable, app-like on mobile -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5FB3A3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Diary">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ WELCOME MODAL (first time only) ============ -->
<div class="modal-overlay" id="welcomeModal" hidden>
  <div class="modal-card">
    <div class="modal-emoji">🌸</div>
    <h2>Welcome!</h2>
    <p class="modal-sub">What should I call you?</p>
    <input id="nicknameInput" class="modal-input" placeholder="Your nickname" maxlength="20">
    <button class="btn-cute" data-action="welcome:save">Let's start ✨</button>
  </div>
</div>

<!-- ============ EDIT NICKNAME MODAL ============ -->
<div class="modal-overlay" id="editNickModal" hidden>
  <div class="modal-card">
    <div class="modal-emoji">✏️</div>
    <h2>Edit your nickname</h2>
    <input id="editNicknameInput" class="modal-input" placeholder="Your nickname" maxlength="20">
    <div class="modal-btn-row">
      <button class="btn-cute ghost-cute" data-action="nickname:cancel">Cancel</button>
      <button class="btn-cute" data-action="nickname:save">Save</button>
    </div>
  </div>
</div>

<!-- ============ SETTINGS MODAL (theme + stickers) ============ -->
<div class="modal-overlay" id="settingsModal" hidden>
  <div class="modal-card">
    <div class="modal-emoji">🎀</div>
    <h2>Customize</h2>
    <div class="label-sm" style="text-align:left;">Accent color</div>
    <div class="theme-row" id="settingsThemeRow"></div>
    <div class="label-sm" style="text-align:left;">Stickers for your bookplate</div>
    <div class="sticker-row" id="settingsStickerRow"></div>
    <div class="modal-btn-row" style="margin-top:18px;">
      <button class="btn-cute" data-action="settings:close">Done</button>
    </div>
  </div>
</div>

<!-- ============ NICKNAME BADGE (always visible, click to edit) ============ -->
<div class="nickname-badge" id="nicknameBadge" data-action="nickname:edit" title="Click to edit your nickname">
  <span class="badge-emoji">👋</span>
  <span id="nicknameText">Friend</span>
  <span class="badge-edit-ic">✎</span>
</div>

<!-- ============ SETTINGS GEAR (always visible) ============ -->
<button class="gear-btn" id="gearBtn" data-action="settings:open" title="Customize">⚙️</button>

<!-- ============ ROOM SCENE ============ -->
<div class="room" id="room">
  <div class="sky" id="sky">
    <div class="cloud cloud-a">☁️</div>
    <div class="cloud cloud-b">☁️</div>
    <div class="stars" id="stars"></div>
    <div class="sun-moon" id="sunMoon">
      <div class="face">
        <span class="eye eye-l"></span>
        <span class="eye eye-r"></span>
        <span class="mouth"></span>
      </div>
    </div>
    <div class="sparkles" id="sparkles">
      <span class="sparkle spark-1">✦</span>
      <span class="sparkle spark-2">✦</span>
      <span class="sparkle spark-3">✦</span>
      <span class="sparkle spark-4">✦</span>
    </div>
    <div class="shooting-star"></div>
    <svg class="constellation" viewBox="0 0 220 130" preserveAspectRatio="xMidYMid meet">
      <line x1="20" y1="90" x2="60" y2="45" class="const-line"/>
      <line x1="60" y1="45" x2="105" y2="75" class="const-line"/>
      <line x1="105" y1="75" x2="155" y2="35" class="const-line"/>
      <line x1="155" y1="35" x2="190" y2="65" class="const-line"/>
      <circle cx="20" cy="90" r="3" class="const-star"/>
      <circle cx="60" cy="45" r="3" class="const-star"/>
      <circle cx="105" cy="75" r="3" class="const-star"/>
      <circle cx="155" cy="35" r="3" class="const-star"/>
      <circle cx="190" cy="65" r="3" class="const-star"/>
    </svg>
  </div>
  <div class="window-frame"></div>

  <div class="wall">
    <div class="shelf-area" id="shelfArea">
      <div class="shelf-header">
        <h1 class="room-title">Spring Diary</h1>
        <p class="room-sub" id="shelfCount">Your shelf is waiting for its first book.</p>
      </div>
      <div id="shelvesContainer"></div>
    </div>
  </div>

  <div class="desk">
    <div class="lamp" id="lampBtn" data-action="lamp:toggle" title="Turn the lamp on/off">
      <div class="lamp-shade"></div>
      <div class="lamp-glow" id="lampGlow"></div>
      <div class="lamp-base"></div>
    </div>
    <div class="desk-plant" id="deskMoon">🌙</div>
  </div>

  <div class="room-footer">
    <span class="rf-item">📚 <span id="rfBooks">0</span> books on your shelf</span>
    <span class="rf-item" id="rfDate"></span>
    <button class="rf-jump" data-action="quick:today">✨ Jump to Today</button>
  </div>
</div>

<!-- ============ BOOK VIEW ============ -->
<div class="book-view" id="bookView" hidden>
  <button class="back-btn" id="backBtn" data-action="book:close">‹ Back to shelf</button>
  <div class="book-wrap">
    <div class="book" id="book">
      <div class="spread visible" id="spread">
        <div class="page page-left" id="pageLeft"></div>
        <div class="spine-fold"></div>
        <div class="page-right-wrap">
          <div class="page page-right" id="pageRight"></div>
          <div class="flip" id="flip" hidden>
            <div class="flip-face flip-front" id="flipFront"></div>
            <div class="flip-face flip-back" id="flipBack"></div>
          </div>
          <div class="tabs" id="tabs"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(err => console.error('SW registration failed', err));
    });
  }
</script>
</body>
</html>
